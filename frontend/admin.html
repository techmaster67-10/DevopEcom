<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevShop | Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand"><h1>DevShop</h1><p>Microservices E-Commerce</p></div>
  <nav><a href="index.html">Shop</a><a href="orders.html">Orders</a><a href="admin.html">Admin</a><a href="status.html">Status</a></nav>
</header>
<main>
  <section class="hero"><h2>Admin</h2><p>Add products and customers. Data lives in memory, so it resets when a service restarts.</p></section>
  <div class="two-col">
    <section class="panel">
      <h2>Add Product</h2>
      <form id="productForm" class="stack">
        <label>Name<input id="pName" required maxlength="60"></label>
        <label>Description<input id="pDesc" maxlength="120"></label>
        <label>Price (₹)<input id="pPrice" type="number" min="0" step="1" required></label>
        <label>Stock<input id="pStock" type="number" min="0" step="1" value="10" required></label>
        <button type="submit">Add Product</button>
      </form>
      <p id="pMsg" class="msg"></p>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th></tr></thead><tbody id="pRows"></tbody></table></div>
    </section>
    <section class="panel">
      <h2>Add Customer</h2>
      <form id="customerForm" class="stack">
        <label>Name<input id="cName" required maxlength="60"></label>
        <label>Email<input id="cEmail" type="email" required maxlength="80"></label>
        <button type="submit">Add Customer</button>
      </form>
      <p id="cMsg" class="msg"></p>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead><tbody id="cRows"></tbody></table></div>
    </section>
  </div>
</main>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
