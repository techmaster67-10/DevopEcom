<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevShop | Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand"><h1>DevShop</h1><p>Microservices E-Commerce</p></div>
  <nav><a href="index.html">Shop</a><a href="orders.html">Orders</a><a href="admin.html">Admin</a><a href="status.html">Status</a></nav>
</header>
<main>
  <section class="hero"><h2>Products</h2><p>Products are loaded from the Product Service.</p></section>
  <section id="products" class="grid"></section>
  <section class="panel">
    <h2>Place Order</h2>
    <form id="orderForm">
      <label>Customer<select id="customerId" required></select></label>
      <label>Product<select id="productId" required></select></label>
      <label>Quantity<input id="quantity" type="number" min="1" value="1" required></label>
      <button type="submit">Create Order</button>
    </form>
    <p id="message" class="msg"></p>
  </section>
  <section class="panel"><h2>Recent Orders</h2><div id="orders"></div></section>
</main>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
