server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/products { proxy_pass http://product-service:3001/products; }
  location /api/customers { proxy_pass http://customer-service:3002/customers; }
  location /api/orders { proxy_pass http://order-service:3003/orders; }
  location = /api/health/product { proxy_pass http://product-service:3001/health; }
  location = /api/health/customer { proxy_pass http://customer-service:3002/health; }
  location = /api/health/order { proxy_pass http://order-service:3003/health; }
}
