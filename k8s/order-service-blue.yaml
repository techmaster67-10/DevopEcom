apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-blue
  namespace: ecommerce
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service, version: blue}}
  template:
    metadata: {labels: {app: order-service, version: blue}}
    spec:
      containers:
      - name: order-service
        image: ghcr.io/your-github-user/ecommerce-order-service:latest
        ports: [{containerPort: 3003}]
        env:
        - {name: PORT, value: "3003"}
        - {name: PRODUCT_SERVICE_URL, value: "http://product-service:3001"}
        - {name: CUSTOMER_SERVICE_URL, value: "http://customer-service:3002"}
        readinessProbe: {httpGet: {path: /health, port: 3003}, initialDelaySeconds: 5, periodSeconds: 10}
