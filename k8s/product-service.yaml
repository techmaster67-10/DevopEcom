apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 1
  selector: {matchLabels: {app: product-service}}
  template:
    metadata: {labels: {app: product-service}}
    spec:
      containers:
      - name: product-service
        image: ghcr.io/your-github-user/ecommerce-product-service:latest
        ports: [{containerPort: 3001}]
        env: [{name: PORT, value: "3001"}]
        readinessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: product-service, namespace: ecommerce}
spec:
  selector: {app: product-service}
  ports: [{port: 3001, targetPort: 3001}]
